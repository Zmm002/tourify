services:
  db:
    image: postgres:18-alpine
    container_name: polo-task-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tourify}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - polo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-tourify}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  polo_postgres_data:
