# Database MySQL lokal untuk development; datanya disimpan di volume bernama.
services:
  db:
    image: mysql:8.4
    container_name: tourify-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tourify}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - tourify_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # Volume ini tetap ada saat container MySQL dimatikan atau dibuat ulang.
  tourify_mysql_data:
