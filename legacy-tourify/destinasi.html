<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wahana - Tourify</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="app-page">
  <div class="site-shell">

  <nav class="navbar">
    <div class="container nav-content">
      <a href="index.html" class="logo" aria-label="Tourify - Beranda">
        <img src="assets/tourify-logo.png" alt="Tourify">
      </a>

      <div class="nav-links">
        <a href="index.html">Beranda</a>
        <a href="destinasi.html" class="active">Wahana</a>
        <a href="index.html#aplikasi">Aplikasi Android</a>
          <a href="admin.html">Admin</a>
      </div>

      <form class="nav-search" id="headerSearchForm" role="search">
        <input type="search" id="headerSearch" placeholder="Cari taman atau kota" aria-label="Cari taman atau kota">
        <button type="submit" aria-label="Cari">⌕</button>
      </form>
    </div>
  </nav>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Semua taman hiburan</h1>
        <p>Pilih taman favoritmu dan lihat wahana yang tersedia.</p>

        <div class="search-box">
          <input
            type="text"
            id="searchDestination"
            placeholder="Cari taman atau kota"
          >
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="park-grid" id="destinationList"></div>
      </div>
    </section>
  </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
